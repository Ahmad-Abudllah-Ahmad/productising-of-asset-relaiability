<svg width="1384" height="778" viewBox="0 0 1384 778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1384" y2="778" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080A20"/>
      <stop offset="50%" stop-color="#0F133D"/>
      <stop offset="100%" stop-color="#171B54"/>
    </linearGradient>
    <linearGradient id="pfFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C37F6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4C37F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="pfStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="52%" stop-color="#4C37F6"/>
      <stop offset="78%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2233EE"/>
      <stop offset="100%" stop-color="#D37BF5"/>
    </linearGradient>
  </defs>

  <rect width="1384" height="778" rx="16" fill="url(#bgA)"/>

  <!-- Subtle Architectural Dot Matrix -->
  <g fill="#A5B4FC" fill-opacity="0.14">
    <circle cx="120" cy="140" r="2"/><circle cx="200" cy="140" r="2"/><circle cx="280" cy="140" r="2"/><circle cx="360" cy="140" r="2"/>
    <circle cx="120" cy="220" r="2"/><circle cx="200" cy="220" r="2"/><circle cx="280" cy="220" r="2"/><circle cx="360" cy="220" r="2"/>
  </g>

  <!-- Upper Connected Object Graph Pipeline (Visual Nodes & Data Flow Pulses, No Text) -->
  <g transform="translate(260, 95)">
    <!-- Connecting Flow Lines -->
    <path d="M90 60 C 190 60, 210 30, 310 30" stroke="#4C37F6" stroke-width="3"/>
    <path d="M90 60 C 190 60, 210 90, 310 90" stroke="#D37BF5" stroke-width="3"/>
    <path d="M390 30 C 490 30, 510 60, 610 60" stroke="#4C37F6" stroke-width="3"/>
    <path d="M390 90 C 490 90, 510 60, 610 60" stroke="#D37BF5" stroke-width="3"/>
    <path d="M690 60 L 860 60" stroke="#34D399" stroke-width="3" stroke-dasharray="8 5"/>

    <!-- Node 1 -->
    <rect x="10" y="20" width="80" height="80" rx="20" fill="#121644" stroke="url(#nodeGrad)" stroke-width="3"/>
    <circle cx="50" cy="60" r="18" stroke="#EAE2FC" stroke-width="2.5"/>
    <circle cx="50" cy="60" r="6" fill="#D37BF5"/>

    <!-- Node 2 Upper -->
    <rect x="310" y="-5" width="80" height="70" rx="18" fill="#121644" stroke="#4C37F6" stroke-width="2.5"/>
    <path d="M332 30 H368 M350 12 V48" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>

    <!-- Node 2 Lower -->
    <rect x="310" y="55" width="80" height="70" rx="18" fill="#121644" stroke="#D37BF5" stroke-width="2.5"/>
    <polygon points="350,72 368,104 332,104" stroke="#EAE2FC" stroke-width="2.5" fill="none"/>

    <!-- Node 3 (Central AI Core) -->
    <rect x="600" y="10" width="100" height="100" rx="26" fill="url(#nodeGrad)"/>
    <circle cx="650" cy="60" r="28" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="650" cy="60" r="10" fill="#FFFFFF"/>

    <!-- Node 4 (Output Health Ring) -->
    <rect x="860" y="15" width="90" height="90" rx="22" fill="#121644" stroke="#34D399" stroke-width="3"/>
    <circle cx="905" cy="60" r="24" stroke="#34D399" stroke-width="4" stroke-dasharray="110 40"/>
    <path d="M895 60 L903 68 L918 52" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Left Card: Asset Lifecycle P-F Curve Visualization (Pure Visual Chart) -->
  <g transform="translate(76, 255)">
    <rect x="0" y="0" width="740" height="455" rx="20" fill="#0B0E2E" stroke="#4C37F6" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Chart Grid Lines -->
    <g stroke="#4C37F6" stroke-opacity="0.16" stroke-width="1.5">
      <line x1="60" y1="70" x2="680" y2="70"/>
      <line x1="60" y1="155" x2="680" y2="155"/>
      <line x1="60" y1="240" x2="680" y2="240"/>
      <line x1="60" y1="325" x2="680" y2="325"/>
      <line x1="60" y1="400" x2="680" y2="400"/>
      <line x1="60" y1="50" x2="60" y2="400"/>
      <line x1="215" y1="50" x2="215" y2="400"/>
      <line x1="370" y1="50" x2="370" y2="400"/>
      <line x1="525" y1="50" x2="525" y2="400"/>
      <line x1="680" y1="50" x2="680" y2="400"/>
    </g>

    <!-- Area Under P-F Curve -->
    <path d="M60 95 C 230 95, 340 120, 435 190 C 530 260, 600 335, 650 398 L 650 400 L 60 400 Z" fill="url(#pfFill)"/>

    <!-- Predictive Maintenance Recovery Trajectory (Green Dashed) -->
    <path d="M435 190 C 505 140, 575 115, 665 110" stroke="#34D399" stroke-width="4" stroke-dasharray="10 6" fill="none"/>
    <circle cx="665" cy="110" r="8" fill="#34D399"/>

    <!-- Main P-F Degradation Curve -->
    <path d="M60 95 C 230 95, 340 120, 435 190 C 530 260, 600 335, 650 398" stroke="url(#pfStroke)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Point P (Potential Failure Detected) Marker -->
    <circle cx="435" cy="190" r="22" fill="#F59E0B" fill-opacity="0.22" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="435" cy="190" r="9" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Point F (Functional Failure Threshold) Marker -->
    <circle cx="620" cy="362" r="20" fill="#EF4444" fill-opacity="0.25" stroke="#EF4444" stroke-width="2"/>
    <circle cx="620" cy="362" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Main Right Card: Multi-Channel Sensor Telemetry & Health Gauges (Pure Visuals) -->
  <g transform="translate(848, 255)">
    <rect x="0" y="0" width="460" height="455" rx="20" fill="#0B0E2E" stroke="#4C37F6" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Dual Circular Health Gauges -->
    <g transform="translate(125, 115)">
      <circle cx="0" cy="0" r="64" stroke="#1E293B" stroke-width="12"/>
      <circle cx="0" cy="0" r="64" stroke="#4C37F6" stroke-width="12" stroke-dasharray="310 100" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="38" stroke="#D37BF5" stroke-width="4" stroke-dasharray="160 80"/>
      <circle cx="0" cy="0" r="12" fill="#EAE2FC"/>
    </g>

    <g transform="translate(335, 115)">
      <circle cx="0" cy="0" r="64" stroke="#1E293B" stroke-width="12"/>
      <circle cx="0" cy="0" r="64" stroke="#34D399" stroke-width="12" stroke-dasharray="340 80" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="38" stroke="#2233EE" stroke-width="4" stroke-dasharray="180 60"/>
      <circle cx="0" cy="0" r="12" fill="#34D399"/>
    </g>

    <!-- Multi-Sensor Spectrum Bars -->
    <g transform="translate(46, 235)">
      <rect x="0" y="0" width="368" height="90" rx="12" fill="#080A20" stroke="#4C37F6" stroke-opacity="0.35"/>
      <g transform="translate(24, 18)">
        <rect x="0" y="24" width="12" height="32" rx="4" fill="#2233EE"/>
        <rect x="24" y="10" width="12" height="46" rx="4" fill="#4C37F6"/>
        <rect x="48" y="4" width="12" height="52" rx="4" fill="#D37BF5"/>
        <rect x="72" y="18" width="12" height="38" rx="4" fill="#4C37F6"/>
        <rect x="96" y="8" width="12" height="48" rx="4" fill="#34D399"/>
        <rect x="120" y="20" width="12" height="36" rx="4" fill="#2233EE"/>
        <rect x="144" y="12" width="12" height="44" rx="4" fill="#4C37F6"/>
        <rect x="168" y="0" width="12" height="56" rx="4" fill="#D37BF5"/>
        <rect x="192" y="14" width="12" height="42" rx="4" fill="#34D399"/>
        <rect x="216" y="22" width="12" height="34" rx="4" fill="#2233EE"/>
        <rect x="240" y="6" width="12" height="50" rx="4" fill="#4C37F6"/>
        <rect x="264" y="16" width="12" height="40" rx="4" fill="#D37BF5"/>
        <rect x="288" y="10" width="12" height="46" rx="4" fill="#34D399"/>
        <rect x="312" y="24" width="12" height="32" rx="4" fill="#4C37F6"/>
      </g>
    </g>

    <!-- Bottom Harmonic Sensor Wave -->
    <g transform="translate(46, 345)">
      <rect x="0" y="0" width="368" height="78" rx="12" fill="#080A20" stroke="#D37BF5" stroke-opacity="0.35"/>
      <path d="M20 45 Q 55 12, 90 45 T 160 45 T 230 45 T 300 45 T 350 45" stroke="#4C37F6" stroke-width="3.5" fill="none"/>
      <path d="M20 45 Q 55 72, 90 45 T 160 45 T 230 45 T 300 45 T 350 45" stroke="#D37BF5" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/>
    </g>
  </g>
</svg>