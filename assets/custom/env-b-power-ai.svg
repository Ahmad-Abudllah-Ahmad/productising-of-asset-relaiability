    <!-- Continuous Telemetry Waveform -->
    <path d="M160 56 C 220 20, 260 68, 320 42 C 380 16, 430 62, 490 34 C 550 10, 600 64, 660 38 C 720 14, 770 58, 830 28 C 890 8, 940 54, 1000 36" stroke="#4C37F6" stroke-width="3" fill="none"/>
    <path d="M160 62 C 220 44, 260 30, 320 52 C 380 68, 430 24, 490 48 C 550 64, 600 22, 660 50 C 720 66, 770 28, 830 46 C 890 62, 940 26, 1000 48" stroke="#D37BF5" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
