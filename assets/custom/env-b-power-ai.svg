<svg width="1384" height="778" viewBox="0 0 1384 778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1384" y2="778" gradientUnits="userSpaceOnUse">
