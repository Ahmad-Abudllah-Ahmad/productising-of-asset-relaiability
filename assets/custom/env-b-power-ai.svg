    <circle cx="0" cy="14" r="8" fill="#4C37F6" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-48" y1="-16" x2="48" y2="-16" stroke="#A5B4FC" stroke-width="3"/>
    <ellipse cx="-48" cy="-20" rx="22" ry="4" fill="#D37BF5" fill-opacity="0.7"/>
    <ellipse cx="48" cy="-20" rx="22" ry="4" fill="#D37BF5" fill-opacity="0.7"/>
  </g>

