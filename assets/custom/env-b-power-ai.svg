    <line x1="0" y1="645" x2="1384" y2="645"/>
    <line x1="0" y1="695" x2="1384" y2="695"/>
    <line x1="0" y1="750" x2="1384" y2="750"/>
    <line x1="692" y1="420" x2="-100" y2="778"/>
    <line x1="692" y1="420" x2="180" y2="778"/>
    <line x1="692" y1="420" x2="440" y2="778"/>
    <line x1="692" y1="420" x2="692" y2="778"/>
    <line x1="692" y1="420" x2="944" y2="778"/>
    <line x1="692" y1="420" x2="1204" y2="778"/>
