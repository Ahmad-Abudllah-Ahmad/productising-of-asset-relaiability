      <ellipse cx="0" cy="18" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
      <ellipse cx="0" cy="34" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
      <ellipse cx="0" cy="50" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
