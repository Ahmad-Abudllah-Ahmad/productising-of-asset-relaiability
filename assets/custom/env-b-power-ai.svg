      <ellipse cx="0" cy="16" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
      <ellipse cx="0" cy="30" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
      <ellipse cx="0" cy="44" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
      <ellipse cx="0" cy="58" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="1.5"/>
