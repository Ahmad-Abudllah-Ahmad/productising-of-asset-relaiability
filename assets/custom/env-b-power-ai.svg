      <rect x="16" y="8" width="8" height="34" rx="4" fill="#4C37F6"/>
      <rect x="32" y="2" width="8" height="40" rx="4" fill="#D37BF5"/>
      <rect x="48" y="12" width="8" height="30" rx="4" fill="#4C37F6"/>
      <rect x="64" y="6" width="8" height="36" rx="4" fill="#34D399"/>
      <rect x="80" y="16" width="8" height="26" rx="4" fill="#2233EE"/>
