    <circle cx="1075" cy="43" r="8" fill="#34D399"/>
    <circle cx="1145" cy="43" r="22" stroke="#4C37F6" stroke-width="4" stroke-dasharray="95 45"/>
    <circle cx="1145" cy="43" r="8" fill="#D37BF5"/>
