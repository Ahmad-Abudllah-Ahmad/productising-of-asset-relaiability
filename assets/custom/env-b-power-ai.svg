      <circle cx="36" cy="70" r="7" fill="#FBBF24"/>
      <circle cx="68" cy="70" r="7" fill="#FBBF24"/>
      <line x1="36" y1="70" x2="68" y2="70" stroke="#FFFFFF" stroke-width="2.5"/>
