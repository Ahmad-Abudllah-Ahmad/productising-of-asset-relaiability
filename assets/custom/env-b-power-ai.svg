      <path d="M-34 8 V-8 H-18 M34 8 V-8 H18 M-34 68 V84 H-18 M34 68 V84 H18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="48" r="24" stroke="#EF4444" stroke-width="2" stroke-opacity="0.85"/>
    </g>

