      <stop offset="60%" stop-color="#2233EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07091E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB2" cx="0.35" cy="0.65" r="0.45">
      <stop offset="0%" stop-color="#D37BF5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07091E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="1">
