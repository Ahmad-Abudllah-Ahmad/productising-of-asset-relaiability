      <ellipse cx="0" cy="16" rx="16" ry="5.5" fill="#4C37F6" stroke="#EAE2FC" stroke-width="1.8"/>
      <ellipse cx="0" cy="32" rx="16" ry="5.5" fill="#D37BF5" stroke="#FFFFFF" stroke-width="2"/>
      <ellipse cx="0" cy="48" rx="16" ry="5.5" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
      <ellipse cx="0" cy="64" rx="16" ry="5.5" fill="#4C37F6" stroke="#EAE2FC" stroke-width="1.8"/>
