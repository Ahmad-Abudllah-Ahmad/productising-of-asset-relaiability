<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Log in | NEXUS OS</title>
  <link rel="icon" href="/assets/custom/favicon.svg" type="image/svg+xml"/>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("/assets/cdn.prod.website-files.com/68c12a5987c0cd3e02e9e53f/68c12ca0bb61be6d27a1bb34_DMSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("/assets/cdn.prod.website-files.com/68c12a5987c0cd3e02e9e53f/68c12ca036654a4f0a914ca0_DMSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: "DM Sans", Arial, sans-serif;
      color: #f4f1ea;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: #0b1020;
    }
    .visual {
      position: relative;
      padding: 36px 56px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(900px 480px at 18% 78%, rgba(120, 140, 255, 0.16), transparent 60%),
        linear-gradient(180deg, #0c1224 0%, #090d18 100%);
      overflow: hidden;
    }
    .dot-field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .mark, .visual-copy, .foot { z-index: 1; }
    .mark { position: relative; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .mark a { color: #fff; text-decoration: none; }
    .visual-copy { position: relative; max-width: 34rem; margin-top: auto; margin-bottom: 18vh; }
    .visual h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    .visual-copy .spark-word {
      display: inline-block;
      opacity: 0;
      transform: translate3d(0, 18px, 0) scale(0.95);
      filter: blur(9px);
    }
    .visual-copy {
      opacity: 0;
      transform: translate3d(0, 38px, 0) scale(0.945);
    }
    .visual-copy.is-in {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      transition:
        transform 1.18s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.96s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .visual-copy.is-in .spark-word {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0);
      transition:
        transform 1.06s cubic-bezier(0.16, 1, 0.3, 1) var(--word-delay, 0ms),
        opacity 0.92s cubic-bezier(0.16, 1, 0.3, 1) var(--word-delay, 0ms),
        filter 0.98s cubic-bezier(0.16, 1, 0.3, 1) var(--word-delay, 0ms);
    }
    @media (prefers-reduced-motion: reduce) {
      .visual-copy,
      .visual-copy .spark-word {
        opacity: 1;
        transform: none;
        filter: none;
        transition: none;
      }
    }
    .panel {
      background: #171c25;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 22px 28px 32px;
    }
    .panel-top { display: flex; justify-content: space-between; align-items: center; }
    .panel-top a { color: #b7b3c7; font-size: 13px; text-decoration: none; }
    .card { width: min(420px, 100%); margin: auto; }
    .modes { display: flex; gap: 8px; margin-bottom: 18px; }
    .modes button {
      flex: 1;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(234, 226, 252, 0.22);
      background: transparent;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .modes button.is-on { background: #EAE2FC; color: #12151c; border-color: #EAE2FC; }
    h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.03em; }
    p.lead { margin: 0 0 20px; color: #b7b3c7; font-size: 14px; }
    label { display: block; margin: 0 0 12px; font-size: 13px; color: #d9d4e6; }
    label[hidden] { display: none; }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #12161e;
      color: #fff;
      font: inherit;
      padding: 0 12px;
    }
    input:focus { outline: 2px solid #c4b5fd; outline-offset: 1px; }
    .submit, .dummy {
      width: 100%;
      height: 46px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .submit {
      margin-top: 6px;
      border: 0;
      background: linear-gradient(180deg, #d8cffc, #b7a6f6);
      color: #1a1430;
      box-shadow: 0 10px 28px -12px rgba(180, 160, 255, 0.9);
    }

      margin-top: 10px;
      border: 1px solid rgba(234, 226, 252, 0.35);

    }
    .dummy:hover { background: rgba(234, 226, 252, 0.08); }
    .error { min-height: 18px; margin: 8px 0 0; color: #f0a3a8; font-size: 13px; }

      body { grid-template-columns: 1fr; }

      .visual-copy { margin-top: 28px; margin-bottom: 8px; }
      .panel { min-height: auto; }
    }

    /* ---------------------------------------------------------------- module-aware redesign */
    :root { --acc: #8ea2ff; --acc-2: #c4b5fd; --acc-ink: #0b1020; }
    body[data-mod] .visual { background: radial-gradient(1100px 620px at 30% 70%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 62%), linear-gradient(180deg, #070b16 0%, #05070f 100%); }
    .stage3d { position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .stage3d.is-on { opacity: 1; }
    .stage3d canvas { width: 100%; height: 100%; display: block; }
    .stage3d::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(5,7,15,.72) 0%, rgba(5,7,15,0) 22%, rgba(5,7,15,0) 48%, rgba(5,7,15,.86) 82%, #05070f 100%), linear-gradient(90deg, rgba(5,7,15,.55) 0%, rgba(5,7,15,0) 45%); }
    body.has-3d .dot-field { opacity: 0.18; transition: opacity 1.2s; }
    .labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .labels .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; color: #fff; padding: 6px 10px 6px 22px; border-radius: 999px; background: rgba(8, 12, 24, .72); border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent); backdrop-filter: blur(8px); box-shadow: 0 8px 24px -10px rgba(0,0,0,.8); transition: opacity .4s; }
    .labels .lbl::before { content: ""; position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 30%, transparent); animation: lblPulse 1.6s infinite; }
    .labels .lbl.t-crit { border-color: rgba(248, 113, 113, .7); } .labels .lbl.t-crit::before { background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.3); }
    .labels .lbl.t-ok::before { background: #4ade80; box-shadow: none; animation: none; } .labels .lbl.t-warn::before { background: #fbbf24; box-shadow: none; animation: none; } .labels .lbl.t-muted { border-color: rgba(255,255,255,.18); } .labels .lbl.t-muted::before { background: #94a3b8; box-shadow: none; animation: none; }
    .labels .lbl::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 70%, transparent), transparent); }
    @keyframes lblPulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--acc) 0%, transparent); } }
    .mod-chip { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #e5e7eb; opacity: 0; transform: translateY(10px); transition: opacity .8s .15s, transform .8s .15s cubic-bezier(0.16, 1, 0.3, 1); }
    .mod-chip b { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); font-size: 11.5px; letter-spacing: .02em; }
    .visual-copy.is-in .mod-chip { opacity: 1; transform: none; }
    .tagline { position: relative; z-index: 1; margin: 16px 0 0; max-width: 30rem; color: #c7cbe0; font-size: 15px; line-height: 1.55; opacity: 0; transform: translateY(12px); transition: opacity .9s .55s, transform .9s .55s cubic-bezier(0.16, 1, 0.3, 1); }
    .visual-copy.is-in .tagline { opacity: 1; transform: none; }
    .caps { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
    .caps li { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: #f1f5f9; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); opacity: 0; transform: translateY(14px) scale(.97); transition: opacity .7s, transform .7s cubic-bezier(0.16, 1, 0.3, 1), border-color .3s, background .3s; }
    .caps li i { width: 8px; height: 8px; border-radius: 2px; background: var(--acc); transform: rotate(45deg); flex: 0 0 auto; }
    .caps li:hover { border-color: color-mix(in srgb, var(--acc) 60%, transparent); background: color-mix(in srgb, var(--acc) 12%, transparent); }
    .visual-copy.is-in .caps li { opacity: 1; transform: none; }
    body[data-mod] .visual h1 .spark-word { background: linear-gradient(180deg, #fff 35%, color-mix(in srgb, var(--acc) 60%, #fff) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
    .mark a { display: inline-block; }
    .mark .nx-logo { height: 38px; width: auto; display: block; }
    /* right panel */
    body[data-mod] .panel { position: relative; overflow: hidden; background: radial-gradient(700px 360px at 85% 0%, color-mix(in srgb, var(--acc) 10%, transparent), transparent 70%), #0f131c; }
    body[data-mod] .panel::before { content: ""; position: absolute; inset: -40%; pointer-events: none; background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in srgb, var(--acc) 14%, transparent) 80%, transparent 90%); animation: sweep 14s linear infinite; opacity: .5; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .panel > * { position: relative; }
    body[data-mod] .card { padding: 28px 28px 24px; border-radius: 20px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(18px); box-shadow: 0 40px 80px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06); animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    .ctx { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
    .ctx-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); border: 1px solid color-mix(in srgb, var(--acc) 40%, transparent); }
    .ctx-ico svg { width: 22px; height: 22px; }
    .ctx-txt { flex: 1; min-width: 0; }
    .ctx-txt small { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #9ca3af; font-weight: 700; }
    .ctx-txt b { display: block; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctx-live { font-size: 11px; font-weight: 700; color: #4ade80; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .ctx-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: ping 1.8s infinite; }
    @keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 22px; }
    .kpis div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); }
    .kpis b { display: block; font-size: 18px; letter-spacing: -.02em; color: #fff; font-variant-numeric: tabular-nums; }
    .kpis span { display: block; font-size: 11px; color: #9ca3af; margin-top: 2px; }
    body[data-mod] .modes { padding: 4px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
    body[data-mod] .modes button { border: 0; height: 34px; transition: background .25s, color .25s; }
    body[data-mod] .modes button.is-on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); box-shadow: 0 8px 20px -10px var(--acc); }
    body[data-mod] input { background: rgba(5,7,15,.55); border-color: rgba(255,255,255,.1); transition: border-color .2s, box-shadow .2s; }
    body[data-mod] input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 22%, transparent); }
    body[data-mod] .submit { position: relative; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 82%, #fff), var(--acc)); color: var(--acc-ink); box-shadow: 0 14px 32px -14px var(--acc); transition: transform .2s, box-shadow .2s; }
    body[data-mod] .submit:hover { transform: translateY(-1px); box-shadow: 0 18px 36px -14px var(--acc); }
    body[data-mod] .submit::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); animation: shine 3.6s 1.2s infinite; }
    @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
    body[data-mod] .dummy { border-color: color-mix(in srgb, var(--acc) 45%, transparent); color: #f1f5f9; }
    body[data-mod] .dummy:hover { background: color-mix(in srgb, var(--acc) 12%, transparent); }
    body[data-mod] .hint { color: var(--acc); }
    .trust { display: flex; gap: 14px; justify-content: center; margin-top: 18px; font-size: 11.5px; color: #8b93a7; }
    .trust span { display: inline-flex; align-items: center; gap: 6px; }
    .trust span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); opacity: .8; }
    @media (prefers-reduced-motion: reduce) { body[data-mod] .panel::before, body[data-mod] .submit::after, .labels .lbl::before, .ctx-live::before { animation: none; } body[data-mod] .card { animation: none; } }
    @media (max-width: 860px) { .labels { display: none; } .caps { display: none; } }
  </style>
</head>
<body>
  <section class="visual">
    <canvas class="dot-field" id="dot-field" aria-hidden="true"></canvas>
    <div class="stage3d" id="stage3d" aria-hidden="true"><canvas id="scene3d"></canvas></div>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="mark"><a href="/" aria-label="NEXUS OS home"><svg class="nx-logo" width="158" height="36" viewBox="0 0 158 36" role="img" aria-label="NEXUS OS"><text class="nx-word" x="0" y="27" fill="#FFFFFF" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.03em">NEXUS OS</text></svg></a></div>
    <script>
      /* the NEXUS OS logo signs out (NEXUS session and the Module 02 server session) and returns to the homepage */
      document.querySelector(".mark a").addEventListener("click", function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        try { localStorage.removeItem("nexus-session"); } catch (err) {}
        var done = false;
        function go() { if (!done) { done = true; window.location.assign("/"); } }
        setTimeout(go, 1500);
        try { fetch("/api/auth/logout", { method: "POST", credentials: "include", keepalive: true }).then(go, go); } catch (err) { go(); }
      });
    </script>
    <div class="visual-copy">
      <div class="mod-chip" id="mod-chip" hidden><b id="mod-code">01</b><span id="mod-kind">NEXUS OS module</span></div>
      <h1 id="module-title">Asset Reliability Intelligence</h1>
      <p class="tagline" id="mod-tagline" hidden></p>
      <ul class="caps" id="mod-caps" hidden></ul>
    </div>
  </section>
  <section class="panel">
    <div class="panel-top"><a href="/">Back to the site</a></div>
    <main class="card">
      <div class="ctx" id="mod-ctx" hidden><span class="ctx-ico" id="ctx-ico"></span><div class="ctx-txt"><small id="ctx-kicker">Module</small><b id="ctx-name"></b></div><span class="ctx-live">Live</span></div>
      <div class="kpis" id="mod-kpis" hidden></div>
      <div class="modes" role="tablist">
        <button type="button" id="show-login" class="is-on" role="tab" aria-selected="true">Log in</button>
        <button type="button" id="show-signup" role="tab" aria-selected="false">Sign up</button>
      </div>
      <h2 id="form-title">Sign in</h2>
      <p class="lead" id="lead">Open this module.</p>
      <form id="auth">
        <label id="name-field" hidden>Full name
          <input id="name" name="name" type="text" autocomplete="name"/>
        </label>
        <label>Email
          <input id="email" name="email" type="email" autocomplete="email" required/>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"/>
        </label>
        <label id="code-field" hidden>Dummy code
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="482910"/>
        </label>
        <p class="hint" id="code-hint" hidden>Use dummy code 482910</p>
        <p class="error" id="error" role="alert"></p>
        <button class="submit" id="submit" type="submit">Sign in</button>
        <button class="dummy" id="dummy" type="button">Dummy login</button>
      </form>
      <div class="trust" id="mod-trust" hidden><span>SSO-ready</span><span>Audit-logged</span><span>Role-based access</span></div>
    </main>
  </section>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = params.get("next") || "/";
      var allowed = next.charAt(0) === "/" && next.charAt(1) !== "/" && next.indexOf("\\") === -1;
      if (!allowed) next = "/";

      var modules = {
        "/reliability/index.html": ["Asset Reliability Intelligence", "Review tower health, linked evidence, and the engineering queue for Corridor North."],
        "/operations/index.html": ["Field Operations Optimization", "Group the approved repairs into one planned inspection-and-repair visit."],
        "/grid/index.html": ["Energy & Grid Performance", "Read the 220 kV corridor beside its recent operational events."],
        "/inventory/index.html": ["Supply Chain & Inventory", "Check replacement hardware for the three approved repair jobs."],
        "/forecast/index.html": ["Risk & Maintenance Forecasting", "See the inspections that need manual engineering review next quarter."],
        "/finance/index.html": ["Financial Intelligence", "Compare the approved budget with the remaining repair backlog."],
        "/workforce/index.html": ["Workforce & Safety", "Confirm work authorization and a qualified crew before the repair starts."],
        "/dashboard": ["AI Inspection & Quality", "Open the inspection workspace for the verified structural findings."],
        "/ai-inspection": ["AI Inspection & Quality", "Open the inspection workspace for the verified structural findings."]
      };
      var chosen = modules[next] || ["Sign in", ""];
      var title = document.getElementById("module-title");
      var words = chosen[0].split(/\s+/);
      title.textContent = "";
      words.forEach(function (word, index) {
        if (index) title.appendChild(document.createTextNode(" "));
        var span = document.createElement("span");
        span.className = "spark-word";
        span.textContent = word;
        span.style.setProperty("--word-delay", Math.min(index * 52, 640) + "ms");
        title.appendChild(span);
      });
      document.title = "Sign in | " + chosen[0];
      requestAnimationFrame(function () {
        document.querySelector(".visual-copy").classList.add("is-in");
      });

      var mode = "login";
      var nameField = document.getElementById("name-field");
      var nameInput = document.getElementById("name");
      var codeField = document.getElementById("code-field");
      var codeInput = document.getElementById("code");
      var codeHint = document.getElementById("code-hint");
      var lead = document.getElementById("lead");
      var submit = document.getElementById("submit");
      var error = document.getElementById("error");
      var formTitle = document.getElementById("form-title");

      function enter(kind, email, name) {
        try {
          localStorage.setItem("nexus-session", JSON.stringify({ email: email, name: name || "", mode: kind }));
        } catch (err) {}
        window.location.assign(next);
      }

      function setMode(nextMode) {
        mode = nextMode;
        var signup = mode === "signup";
        nameField.hidden = !signup;
        nameInput.required = signup;
        codeField.hidden = !signup;
        codeInput.required = signup;
        codeHint.hidden = !signup;
        document.getElementById("password").setAttribute("autocomplete", signup ? "new-password" : "current-password");
        document.getElementById("show-login").classList.toggle("is-on", !signup);
        document.getElementById("show-signup").classList.toggle("is-on", signup);
        document.getElementById("show-login").setAttribute("aria-selected", String(!signup));
        document.getElementById("show-signup").setAttribute("aria-selected", String(signup));
        formTitle.textContent = signup ? "Sign up" : "Sign in";
        lead.textContent = signup ? "Create an account for " + chosen[0] + "." : "Open " + chosen[0] + ".";
        submit.textContent = signup ? "Sign up" : "Sign in";
        error.textContent = "";
      }

      document.getElementById("show-login").addEventListener("click", function () { setMode("login"); });
      document.getElementById("show-signup").addEventListener("click", function () { setMode("signup"); });
